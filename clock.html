<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Copenhagen Clock</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #label {
    font-size: 14px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 16px;
  }
  #clock {
    font-size: 96px;
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: 4px;
  }
  #date {
    font-size: 18px;
    color: #aaa;
    margin-top: 12px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>
  <div id="label">Europe / Copenhagen</div>
  <div id="clock">--:--:--</div>
  <div id="date">--</div>

<script>
  const clockEl = document.getElementById('clock');
  const dateEl = document.getElementById('date');
  const TZ = 'Europe/Copenhagen';

  const timeFmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ,
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false,
  });
  const dateFmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: TZ,
    weekday: 'long',
    year: 'numeric',
    month: 'long',
    day: 'numeric',
  });

  function tick() {
    const now = new Date();
    clockEl.textContent = timeFmt.format(now);
    dateEl.textContent = dateFmt.format(now);
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
